<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SMMT x NEXO 공동구매 - 수학 선생님을 위한 전자칠판" />
    <title>SMMT × NEXO | 공동구매 랜딩 페이지</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="customer_name" />
      <input type="text" name="org_name" />
      <input type="tel" name="phone_number" />
      <input type="text" name="region" />
      <select name="size">
        <option value="65">65인치</option>
        <option value="75">75인치</option>
        <option value="86">86인치</option>
      </select>
      <select name="mount_type">
        <option value="wall">벽걸이</option>
        <option value="stand">이동형 스탠드</option>
      </select>
      <select name="quantity">
        <option value="1">1대</option>
        <option value="2">2대</option>
        <option value="3">3대</option>
        <option value="4">4대</option>
        <option value="5">5대</option>
        <option value="6">6대</option>
        <option value="7">7대</option>
        <option value="8">8대</option>
        <option value="9">9대</option>
        <option value="10">10대</option>
      </select>
      <input type="checkbox" name="privacy_agree" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="inquiry_date" />
      <input type="hidden" name="bot-field" />
    </form>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
